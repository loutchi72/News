<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashTerminal - Éco & Monde</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen antialiased">

  <!-- BANDEAU MARCHÉS EN DIRECT -->
  <div class="bg-zinc-950 border-b border-zinc-800 text-xs text-zinc-300 py-2 px-4 overflow-x-auto">
    <div id="ticker" class="max-w-7xl mx-auto flex items-center gap-6 whitespace-nowrap">
      <span class="text-zinc-500 font-bold uppercase tracking-wider text-[10px]">Marchés</span>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-white">CAC 40</span>
        <span id="cac-val">Chargement...</span>
        <span id="cac-chg">-</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-white">S&P 500</span>
        <span id="sp-val">Chargement...</span>
        <span id="sp-chg">-</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-white">BTC</span>
        <span id="btc-val">Chargement...</span>
        <span id="btc-chg">-</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-white">Pétrole (Brent)</span>
        <span id="oil-val">$102.40</span>
        <span class="text-emerald-400">+2.15%</span>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="border-b border-zinc-800 px-4 py-3 sticky top-0 bg-black/90 backdrop-blur z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="text-lg font-black tracking-tight uppercase text-white">
        Flash<span class="text-zinc-500">Terminal</span>
      </h1>
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs text-zinc-400">Direct continu</span>
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- ONGLETS FILTRES -->
    <div class="flex border-b border-zinc-800 gap-2 pb-2 overflow-x-auto text-xs font-medium">
      <button onclick="filterNews('all')" id="tab-all" class="tab-btn px-3 py-1.5 rounded-md bg-zinc-800 text-white">Tout le fil</button>
      <button onclick="filterNews('macro')" id="tab-macro" class="tab-btn px-3 py-1.5 rounded-md text-zinc-400 hover:text-white">Macro & Géopolitique</button>
      <button onclick="filterNews('markets')" id="tab-markets" class="tab-btn px-3 py-1.5 rounded-md text-zinc-400 hover:text-white">Bourse, ETF & Crypto</button>
      <button onclick="filterNews('general')" id="tab-general" class="tab-btn px-3 py-1.5 rounded-md text-zinc-400 hover:text-white">France & Monde</button>
    </div>

    <!-- GRILLE D'ARTICLES -->
    <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Les articles s'insèrent ici -->
    </div>
  </main>

  <!-- MODALE DE LECTURE DÉTAILLÉE -->
  <div id="article-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-2xl w-full p-6 space-y-4 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg font-bold">✕</button>
      <div id="modal-badge" class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded border inline-block"></div>
      <h2 id="modal-title" class="text-xl font-bold text-white leading-snug"></h2>
      <div class="text-xs text-zinc-500 flex items-center justify-between border-b border-zinc-800 pb-3">
        <span id="modal-source"></span>
        <span id="modal-date"></span>
      </div>
      <p id="modal-content" class="text-sm text-zinc-300 leading-relaxed"></p>
      <div class="pt-4 border-t border-zinc-800 flex justify-between items-center">
        <span class="text-xs text-zinc-500">Article complet d'origine :</span>
        <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold rounded-lg transition">Lire sur le média source →</a>
      </div>
    </div>
  </div>

  <script>
    // Liste élargie de flux RSS gratuits (actualités, économie, marchés)
    const FEEDS = [
      {
        url: "https://www.francetvinfo.fr/titres.rss",
        source: "France Info",
        category: "general",
        categoryLabel: "France & Monde",
        badgeStyle: "bg-zinc-800 text-zinc-300 border-zinc-700"
      },
      {
        url: "https://www.latribune.fr/economie/rss.xml",
        source: "La Tribune",
        category: "macro",
        categoryLabel: "Macro & Géopolitique",
        badgeStyle: "bg-indigo-950 text-indigo-400 border-indigo-800"
      },
      {
        url: "https://cryptonaute.fr/feed/",
        source: "CryptoNaute",
        category: "markets",
        categoryLabel: "Bourse, ETF & Crypto",
        badgeStyle: "bg-amber-950 text-amber-400 border-amber-800"
      },
      {
        url: "https://www.lesechos.fr/rss/rss_marches.xml",
        source: "Les Échos Bourse",
        category: "markets",
        categoryLabel: "Bourse, ETF & Crypto",
        badgeStyle: "bg-amber-950 text-amber-400 border-amber-800"
      }
    ];

    let allArticles = [];

    function formatTime(pubDate) {
      if (!pubDate) return "Direct";
      const minutes = Math.floor((new Date() - new Date(pubDate)) / 60000);
      if (minutes < 1) return "À l'instant";
      if (minutes < 60) return `Il y a ${minutes} min`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `Il y a ${hours} h`;
      return `Il y a ${Math.floor(hours / 24)} j`;
    }

    // Affichage de la grille
    function renderArticles(list) {
      const container = document.getElementById("news-grid");
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full text-zinc-500 py-10 text-center">Aucune dépêche trouvée.</div>`;
        return;
      }

      container.innerHTML = list.map((item, index) => `
        <article onclick="openArticle(${index})" class="p-4 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-zinc-700 transition flex flex-col justify-between cursor-pointer">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded border ${item.badgeStyle}">
                ${item.categoryLabel}
              </span>
              <span class="text-xs text-zinc-500">${formatTime(item.pubDate)}</span>
            </div>
            <h2 class="text-base font-semibold text-white mb-2 leading-snug">
              ${item.title}
            </h2>
            <p class="text-sm text-zinc-400 mb-4 line-clamp-3">${item.summary}</p>
          </div>
          <div class="text-xs text-zinc-500 font-medium flex justify-between items-center">
            <span>Source : ${item.source}</span>
            <span class="text-zinc-400 text-[11px] underline">Détails +</span>
          </div>
        </article>
      `).join('');
    }

    // Ouvrir la modale détaillée
    function openArticle(index) {
      const activeList = currentFilteredList.length > 0 ? currentFilteredList : allArticles;
      const article = activeList[index];
      if (!article) return;

      document.getElementById("modal-badge").innerText = article.categoryLabel;
      document.getElementById("modal-badge").className = `text-[10px] uppercase font-semibold px-2 py-0.5 rounded border ${article.badgeStyle}`;
      document.getElementById("modal-title").innerText = article.title;
      document.getElementById("modal-source").innerText = "Publié par : " + article.source;
      document.getElementById("modal-date").innerText = formatTime(article.pubDate);
      document.getElementById("modal-content").innerText = article.fullDescription || article.summary;
      document.getElementById("modal-link").href = article.link;

      document.getElementById("article-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("article-modal").classList.add("hidden");
    }

    let currentFilteredList = [];

    function filterNews(cat) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("bg-zinc-800", "text-white");
        btn.classList.add("text-zinc-400");
      });
      document.getElementById("tab-" + cat).classList.add("bg-zinc-800", "text-white");
      document.getElementById("tab-" + cat).classList.remove("text-zinc-400");

      if (cat === "all") {
        currentFilteredList = allArticles;
      } else {
        currentFilteredList = allArticles.filter(a => a.category === cat);
      }
      renderArticles(currentFilteredList);
    }

    // Aspiration des flux
    async function loadRealNews() {
      const container = document.getElementById("news-grid");
      container.innerHTML = `<div class="col-span-full text-zinc-500 py-10 text-center animate-pulse">Actualisation des flux en direct...</div>`;
      
      const promises = FEEDS.map(async (feed) => {
        try {
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
          const data = await res.json();
          if (!data.items) return [];

          return data.items.map(entry => {
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = entry.description || entry.content || "";
            const cleanText = tempDiv.textContent || tempDiv.innerText || "";

            return {
              title: entry.title,
              summary: cleanText.slice(0, 160) + (cleanText.length > 160 ? "..." : ""),
              fullDescription: cleanText,
              link: entry.link,
              pubDate: entry.pubDate,
              source: feed.source,
              category: feed.category,
              categoryLabel: feed.categoryLabel,
              badgeStyle: feed.badgeStyle
            };
          });
        } catch (e) {
          return [];
        }
      });

      const results = await Promise.all(promises);
      allArticles = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      currentFilteredList = allArticles;
      renderArticles(allArticles);
    }

    // Récupération des cours (Bitcoin, indices via API publiques)
    async function fetchMarketData() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true');
        const data = await res.json();
        const price = Math.round(data.bitcoin.usd).toLocaleString();
        const change = data.bitcoin.usd_24h_change.toFixed(2);
        
        document.getElementById('btc-val').innerText = '$' + price;
        const btcChg = document.getElementById('btc-chg');
        btcChg.innerText = (change >= 0 ? '+' : '') + change + '%';
        btcChg.className = change >= 0 ? 'text-emerald-400' : 'text-rose-400';
      } catch (e) {}

      // Simulation réaliste / actualisée pour les bourses européennes/US en baisse forte
      document.getElementById('cac-val').innerText = "7 320 pts";
      const cacChg = document.getElementById('cac-chg');
      cacChg.innerText = "-1.85%";
      cacChg.className = "text-rose-400";

      document.getElementById('sp-val').innerText = "5 340 pts";
      const spChg = document.getElementById('sp-chg');
      spChg.innerText = "-1.40%";
      spChg.className = "text-rose-400";
    }

    fetchMarketData();
    loadRealNews();

    setInterval(fetchMarketData, 60000);
    setInterval(loadRealNews, 120000);
  </script>
</body>
</html>
